# Local portfolio environment; Docker DNS resolves the DB service as "db".
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.show-sql=false
# PostgreSQL-specific: stop waiting on a busy balance row after five seconds.
spring.datasource.hikari.connection-init-sql=SET lock_timeout = '5s'
