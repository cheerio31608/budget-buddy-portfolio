spring.application.name=budget-buddy

# 기본 활성화 프로필 설정 (local)
spring.profiles.active=local

# PostgreSQL defaults contain no secret. Override them with environment variables.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/budget_buddy_portfolio}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:dummy-api-key}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:1800}
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.ai.daily-user-limit=${AI_DAILY_USER_LIMIT:3}
app.ai.daily-global-limit=${AI_DAILY_GLOBAL_LIMIT:30}
app.ai.cooldown-seconds=${AI_COOLDOWN_SECONDS:60}
server.error.include-message=never
server.error.include-stacktrace=never

# Async Execution Configuration
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# SQL error details can include financial row values; use the safe application error handler.
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
